version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/"
    labels:
      - "dependencies"
      - "php"
      - "automated pr"
    schedule:
      interval: "monthly"
    target-branch: "alpha"
  - package-ecosystem: "npm"
    directory: "/"
    labels:
      - "dependencies"
      - "javascript"
      - "automated pr"
    schedule:
      interval: "monthly"
    target-branch: "alpha"
  - package-ecosystem: "github-actions"
    directory: "/"
    labels:
      - "dependencies"
      - "automated pr"
    schedule:
      interval: "monthly"
    target-branch: "alpha"
