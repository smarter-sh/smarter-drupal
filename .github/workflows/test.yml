---
#------------------------------------------------------------------------------
# Lint (PHPCS) and run the unit tests on every supported PHP version.
# The unit tests cover the pure classes; the smoke test (make smoke) covers Drupal.
#------------------------------------------------------------------------------
name: Test

on:
  workflow_dispatch:
  push:
    branches: [main, alpha, beta]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.1", "8.3"]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php-version }}
          coverage: pcov
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Lint (PHPCS)
        run: vendor/bin/phpcs

      - name: Unit tests, with coverage
        run: vendor/bin/phpunit

      - name: Upload coverage to Codecov
        if: matrix.php-version == '8.3'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./build/coverage.xml
          flags: drupal
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
